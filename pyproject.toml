[project]
name = "arbitrage-scanner-bot"
version = "1.0.0"
description = "Crypto Arbitrage Scanner Telegram Bot — bot + scanning engine"
requires-python = ">=3.11"
dependencies = [
    "aiogram==3.13.1",
    "SQLAlchemy[asyncio]==2.0.35",
    "alembic==1.13.3",
    "asyncpg==0.30.0",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "aiohttp==3.10.9",
    "aiohttp-socks==0.9.0",
    "certifi>=2024.8.30",
    "structlog==24.4.0",
    "orjson==3.10.7",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "pytest-cov==5.0.0",
    "aiosqlite==0.20.0",
    "ruff==0.6.9",
    "mypy==1.11.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Translation catalog: human-readable strings must not be wrapped mid-sentence.
"src/bot/i18n/catalog.py" = ["E501"]
